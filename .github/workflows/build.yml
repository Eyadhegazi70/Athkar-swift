name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Create Xcode Project & Build IPA
      run: |
        # إنشاء هيكل مشروع Xcode سليم ومنسق
        mkdir -p AthkarApp.xcodeproj
        
        cat << 'EOF' > AthkarApp.xcodeproj/project.pbxproj
