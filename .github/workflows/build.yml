name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Create Xcode Project & Build IPA
      run: |
        # إنشاء هيكل مشروع Xcode وهمي بسيط لبناء الملفات
        mkdir -p AthkarApp.xcodeproj
        
        # بناء التطبيق بدون التوقيع بـ Developer Certificate
        xcodebuild clean build \
          -project AthkarApp.xcodeproj \
          -scheme AthkarApp \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

        # تجميع الناتج داخل مجلد Payload لإنشاء الـ .ipa
        mkdir -p Payload
        cp -r build/Release-iphoneos/AthkarApp.app Payload/
        zip -r AthkarApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AthkarApp-IPA
        path: AthkarApp.ipa
