name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build App & Create IPA
      run: |
        # بناء التطبيق مباشرة عبر Swift PM بدون ملفات xcodeproj
        swift build -c release --triple arm64-apple-ios15.0-simulator
        
        # تحضير مجلد التطبيق والـ IPA
        mkdir -p Payload/AthkarApp.app
        cp -R .build/arm64-apple-ios15.0-simulator/release/AthkarApp Payload/AthkarApp.app/AthkarApp || true
        cp Info.plist Payload/AthkarApp.app/
        
        zip -r AthkarApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AthkarApp-IPA
        path: AthkarApp.ipa
